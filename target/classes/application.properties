# Conexão com o MySQL na porta 3307
spring.datasource.url=jdbc:mysql://localhost:3307/financeiro_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Configuração do Hibernate para criar/atualizar tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true